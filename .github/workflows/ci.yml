name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-php:
    name: Build (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php-app
    strategy:
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: apcu
          tools: composer:v2
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint PHP sources
        run: |
          find src public -name '*.php' -print0 | xargs -0 -n1 php -l

  build-java:
    name: Build (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn -B verify

  build-node:
    name: Build (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-app
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test

  build-dotnet:
    name: Build (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet-app
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release

  build-exporter:
    name: Build (phpinfo-exporter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phpinfo-exporter
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile exporter.py
