global:
  scrape_interval: 15s

scrape_configs:
  # The PHP app's own exporter (request counters, process/system gauges).
  - job_name: php-app
    metrics_path: /metrics
    static_configs:
      - targets: ["php-app:80"]

  # The Python exporter that scrapes /phpinfo (OPcache memory, PHP version).
  - job_name: phpinfo-exporter
    static_configs:
      - targets: ["phpinfo-exporter:9308"]
